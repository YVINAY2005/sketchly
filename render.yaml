services:
  - type: web
    name: sketchly-multiplayer
    env: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Set in Render dashboard or use MongoDB Atlas connection string
      - key: CLIENT_URL
        value: https://sketchly-multiplayer.onrender.com

